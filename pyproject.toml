[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "releasetrain-triage-bench"
version = "0.1.0"
description = "A reproducible benchmark harness for measuring guardrail compliance in agentic software-update triage systems."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "SE4CPS" },
]
keywords = ["agentic-ai", "software-engineering", "benchmark", "llm-agents", "guardrails", "software-updates"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/SE4CPS/releasetrain-triage-bench"
Issues = "https://github.com/SE4CPS/releasetrain-triage-bench/issues"

[project.scripts]
releasetrain-triage-bench = "releasetrain_triage_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/releasetrain_triage_bench"]

[tool.hatch.build.targets.wheel.force-include]
"src/releasetrain_triage_bench/data/sample_benchmark.json" = "releasetrain_triage_bench/data/sample_benchmark.json"
"src/releasetrain_triage_bench/data/nvd_snapshot_v1.json" = "releasetrain_triage_bench/data/nvd_snapshot_v1.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
